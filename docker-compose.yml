services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tailor-website
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:?DB_CONNECTION_STRING must be set}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8785
    ports:
      - "8785:8785"
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "grep -qE '(^|:)2251 ' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  db-network:
    external: true
    name: db-network